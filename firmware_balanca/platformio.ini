[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

lib_deps =
  bogde/HX711@^0.7.5
  adafruit/Adafruit PN532@^1.3.4
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I include
